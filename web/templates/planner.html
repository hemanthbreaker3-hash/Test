<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Merge Planner</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #1a1a2e;
      --card-bg: #16213e;
      --accent: #0f3460;
      --text: #e94560;
      --text-light: #ffffff;
      --btn-bg: #e94560;
      --btn-hover: #ff6b81;
      --danger: #d9534f;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-light);
      margin: 0;
      padding: 15px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: var(--text-light);
    }
    .form-group {
      margin-bottom: 20px;
      background: var(--card-bg);
      padding: 15px;
      border-radius: 8px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }
    input[type="text"] {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
      border: 1px solid #0f3460;
      border-radius: 6px;
      background-color: #0f3460;
      color: #fff;
      font-size: 14px;
    }
    .file-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .file-item {
      background: var(--card-bg);
      margin-bottom: 10px;
      padding: 12px 15px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .file-info {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow: hidden;
    }
    .serial {
      background: var(--btn-bg);
      color: #fff;
      font-weight: bold;
      border-radius: 50%;
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      flex-shrink: 0;
    }
    .filename {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 14px;
    }
    .controls {
      display: flex;
      gap: 5px;
      flex-shrink: 0;
    }
    .btn-ctrl {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    .btn-ctrl:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
    .actions {
      display: flex;
      gap: 10px;
      margin-top: 25px;
    }
    .btn-action {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      color: #fff;
      text-align: center;
    }
    .btn-save {
      background: #28a745;
    }
    .btn-save:hover {
      background: #34ce57;
    }
    .btn-delete {
      background: var(--danger);
    }
    .btn-delete:hover {
      background: #c9302c;
    }
    #status-msg {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>🧩 Mini Merge Planner</h2>

    <div class="form-group">
      <label for="out-filename">Output Filename:</label>
      <input type="text" id="out-filename" placeholder="output.mp4">
    </div>

    <div class="form-group">
      <label>Files to Merge (Order):</label>
      <ul id="file-list" class="file-list">
        <!-- Dynamic list -->
      </ul>
    </div>

    <div class="actions">
      <button class="btn-action btn-save" onclick="savePlanner()">💾 Save Planner</button>
      <button class="btn-action btn-delete" onclick="deletePlanner()">🗑️ Delete Planner</button>
    </div>

    <div id="status-msg"></div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand();
    }

    const urlParams = new URLSearchParams(window.location.search);
    const mid = urlParams.get('mid');
    const user_id = urlParams.get('user_id');

    let fileItems = [];

    async function loadPlanner() {
      if (!mid || !user_id) {
        document.getElementById('status-msg').innerText = 'Error: Missing mid or user_id parameters.';
        return;
      }

      try {
        const resp = await fetch(`/api/planner/data?mid=${mid}&user_id=${user_id}`);
        const data = await resp.json();
        if (data.error) {
          document.getElementById('status-msg').innerText = 'Error: ' + data.error;
          return;
        }

        document.getElementById('out-filename').value = data.output_filename || 'merged_output.mp4';
        fileItems = data.files || [];
        renderList();
      } catch (e) {
        document.getElementById('status-msg').innerText = 'Failed to load planner data.';
      }
    }

    function renderList() {
      const listEl = document.getElementById('file-list');
      listEl.innerHTML = '';

      fileItems.forEach((file, idx) => {
        const li = document.createElement('li');
        li.className = 'file-item';

        li.innerHTML = `
          <div class="file-info">
            <div class="serial">${idx + 1}</div>
            <div class="filename" title="${file}">${file}</div>
          </div>
          <div class="controls">
            <button class="btn-ctrl" ${idx === 0 ? 'disabled' : ''} onclick="moveItem(${idx}, -1)">▲</button>
            <button class="btn-ctrl" ${idx === fileItems.length - 1 ? 'disabled' : ''} onclick="moveItem(${idx}, 1)">▼</button>
          </div>
        `;
        listEl.appendChild(li);
      });
    }

    function moveItem(idx, dir) {
      const targetIdx = idx + dir;
      if (targetIdx < 0 || targetIdx >= fileItems.length) return;
      const temp = fileItems[idx];
      fileItems[idx] = fileItems[targetIdx];
      fileItems[targetIdx] = temp;
      renderList();
    }

    async function savePlanner() {
      const outName = document.getElementById('out-filename').value.trim();
      if (!outName) {
        alert('Please enter a valid output filename!');
        return;
      }

      try {
        const resp = await fetch('/api/planner/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            mid: mid,
            user_id: user_id,
            output_filename: outName,
            files: fileItems
          })
        });
        const res = await resp.json();
        if (res.success) {
          document.getElementById('status-msg').style.color = '#28a745';
          document.getElementById('status-msg').innerText = 'Planner saved! You can close this app now.';
          if (tg) tg.close();
        } else {
          document.getElementById('status-msg').style.color = '#d9534f';
          document.getElementById('status-msg').innerText = 'Error saving: ' + (res.error || 'Unknown error');
        }
      } catch (e) {
        document.getElementById('status-msg').style.color = '#d9534f';
        document.getElementById('status-msg').innerText = 'Failed to save planner.';
      }
    }

    async function deletePlanner() {
      if (!confirm('Are you sure you want to delete this planner?')) return;

      try {
        const resp = await fetch('/api/planner/delete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mid: mid, user_id: user_id })
        });
        const res = await resp.json();
        if (res.success) {
          document.getElementById('status-msg').style.color = '#d9534f';
          document.getElementById('status-msg').innerText = 'Planner deleted.';
          if (tg) tg.close();
        } else {
          document.getElementById('status-msg').innerText = 'Error deleting: ' + (res.error || 'Unknown error');
        }
      } catch (e) {
        document.getElementById('status-msg').innerText = 'Failed to delete planner.';
      }
    }

    window.onload = loadPlanner;
  </script>
</body>
</html>
